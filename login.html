<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Urbana High School Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h2>Urbana High School</h2>
      <p>Sign in to view schedules and shared classes</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Student Username / Email</label>
        <input type="text" id="username" placeholder="e.g. john.ballenger" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">Sign In</button>
      <div id="loginError" class="error-msg" style="display: none;"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('loginError');
      errorDiv.style.display = 'none';

      const username = document.getElementById('username').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('uhs_user_id', data.userId);
          localStorage.setItem('uhs_user_name', data.name);
          window.location.href = 'index.html';
        } else {
          errorDiv.innerText = data.error || 'Login failed. Try again.';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Server error. Check your connection.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
