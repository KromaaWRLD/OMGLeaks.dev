<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Winters | Contributor Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090b] text-white font-sans antialiased min-h-screen">

  <!-- LOGIN OVERLAY -->
  <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-[#121212] border border-[#27272a] rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <h2 class="text-xl font-bold text-center text-purple-400">Contributor Login</h2>
      <div id="login-error" class="hidden text-xs text-pink-500 font-medium text-center"></div>
      <input id="login-user" type="text" placeholder="Username" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
      <input id="login-pass" type="password" placeholder="Password" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
      <button onclick="handleLogin()" class="w-full bg-purple-600 hover:bg-purple-700 font-bold py-2 rounded-lg text-sm transition-all">Sign In</button>
    </div>
  </div>

  <!-- PORTAL CONTENT -->
  <div class="max-w-6xl mx-auto p-6 space-y-8">
    <header class="flex justify-between items-center border-b border-[#1e1e1e] pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white">Contributor Portal</h1>
        <p class="text-xs text-zinc-400">Upload Tracks Directly into MongoDB Atlas</p>
      </div>
      <a href="/" class="text-xs text-zinc-400 hover:text-white bg-[#18181b] px-3 py-2 rounded-lg border border-[#27272a]">Back to Player ←</a>
    </header>

    <!-- TABS -->
    <div class="flex gap-4 border-b border-[#1e1e1e]">
      <button id="tab-songs-btn" onclick="switchTab('songs')" class="pb-2 text-sm font-bold border-b-2 border-purple-500 text-purple-400">Manage Songs</button>
      <button id="tab-news-btn" onclick="switchTab('news')" class="pb-2 text-sm font-bold text-zinc-400 hover:text-white">Publish News / Alerts</button>
    </div>

    <!-- SONGS SECTION -->
    <section id="section-songs" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <form id="song-form" onsubmit="addSong(event)" class="bg-[#121212] border border-[#1e1e1e] rounded-xl p-4 space-y-3 h-fit">
        <h3 class="text-sm font-bold text-purple-400 uppercase tracking-wider">Add Track to MongoDB</h3>
        
        <input id="song-title" type="text" placeholder="Song Title *" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        <input id="song-artist" type="text" placeholder="Primary Artist *" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        <input id="song-featured" type="text" placeholder="Featured Artists (Optional)" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        
        <label class="block text-xs text-zinc-400">Juice WRLD Era</label>
        <select id="song-era" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
          <option value="JW3">JW3 / Outsiders Era</option>
          <option value="LND">Legends Never Die (LND)</option>
          <option value="FD">Fighting Demons (FD)</option>
          <option value="OTHER">Other Releases</option>
        </select>

        <!-- Extended Info -->
        <div class="border-t border-[#1e1e1e] pt-2 space-y-2">
          <span class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider">Production Credits</span>
          <input id="song-producers" type="text" placeholder="Producer(s)" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
          <input id="song-engineers" type="text" placeholder="Engineers" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
          <input id="song-rec-date" type="text" placeholder="Recording Date" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
          <input id="song-location" type="text" placeholder="Studio Location" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        </div>

        <!-- Direct MongoDB File Uploads -->
        <div class="border-t border-[#1e1e1e] pt-2 space-y-2">
          <span class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider">Direct Media Files (< 16MB)</span>
          <div>
            <label class="block text-[10px] text-zinc-400">Audio File (.mp3/.wav)</label>
            <input id="song-audio-file" type="file" accept="audio/*" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-2 py-1 text-xs text-zinc-400">
            <input id="song-audio-url" type="url" placeholder="or Direct Link URL" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-1.5 text-xs text-white mt-1">
          </div>

          <div>
            <label class="block text-[10px] text-zinc-400">Cover Image</label>
            <input id="song-cover-file" type="file" accept="image/*" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-2 py-1 text-xs text-zinc-400">
            <input id="song-cover-url" type="url" placeholder="or Direct Link URL" class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-1.5 text-xs text-white mt-1">
          </div>
        </div>

        <button type="submit" id="submit-song-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-xs font-bold py-2 rounded-lg transition-all">Save to MongoDB</button>
      </form>

      <div class="md:col-span-2 space-y-3">
        <h3 class="text-sm font-bold text-zinc-400 uppercase tracking-wider">MongoDB Tracks</h3>
        <div id="songs-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- NEWS SECTION -->
    <section id="section-news" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6">
      <form id="news-form" onsubmit="addNews(event)" class="bg-[#121212] border border-[#1e1e1e] rounded-xl p-4 space-y-3 h-fit">
        <h3 class="text-sm font-bold text-purple-400 uppercase tracking-wider">Create News / Alert</h3>
        <input id="news-version" type="text" placeholder="Version (e.g., v1.4.0)" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        <input id="news-title" type="text" placeholder="Update Title" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        <input id="news-group" type="text" placeholder="Header Group" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white">
        <textarea id="news-summary" placeholder="Summary" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white h-20"></textarea>
        <textarea id="news-changes" placeholder="Key Changes (Comma Separated)" required class="w-full bg-[#18181b] border border-[#27272a] rounded-lg px-3 py-2 text-xs text-white h-20"></textarea>
        
        <div class="flex items-center gap-2 pt-1">
          <input id="news-notify" type="checkbox" class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-purple-600 focus:ring-0">
          <label for="news-notify" class="text-xs text-pink-400 font-bold">Push Notification Alert to Bell Badge</label>
        </div>

        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-xs font-bold py-2 rounded-lg">Publish News</button>
      </form>

      <div class="md:col-span-2 space-y-3">
        <h3 class="text-sm font-bold text-zinc-400 uppercase tracking-wider">Active News Posts</h3>
        <div id="news-list" class="space-y-2"></div>
      </div>
    </section>
  </div>

  <script>
    const API = "/api";

    // Helper: Convert File to Base64 String
    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    function handleLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const err = document.getElementById('login-error');

      fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      })
      .then(r => r.json())
      .then(res => {
        if (res.success) {
          localStorage.setItem('cw_auth_token', res.token);
          document.getElementById('login-modal').classList.add('hidden');
          loadAllData();
        } else {
          err.textContent = res.message || "Invalid credentials.";
          err.classList.remove('hidden');
        }
      })
      .catch(() => {
        err.textContent = "Error connecting to backend.";
        err.classList.remove('hidden');
      });
    }

    function switchTab(tab) {
      if (tab === 'songs') {
        document.getElementById('section-songs').classList.remove('hidden');
        document.getElementById('section-news').classList.add('hidden');
      } else {
        document.getElementById('section-songs').classList.add('hidden');
        document.getElementById('section-news').classList.remove('hidden');
      }
    }

    function loadAllData() {
      fetchSongs();
      fetchNews();
    }

    async function fetchSongs() {
      const res = await fetch(`${API}/songs`);
      const songs = await res.json();
      document.getElementById('songs-list').innerHTML = songs.map(s => `
        <div class="bg-[#121212] border border-[#1e1e1e] rounded-xl p-3 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <img src="${s.coverArt}" class="w-10 h-10 rounded-lg object-cover">
              <div>
                <div class="font-bold text-xs text-white">${s.title} <span class="text-[10px] text-purple-400 bg-purple-500/10 px-1.5 py-0.5 rounded border border-purple-500/20">${s.era}</span></div>
                <div class="text-[11px] text-zinc-400">${s.artist} ${s.producers ? `(Prod. ${s.producers})` : ''}</div>
              </div>
            </div>
            <button onclick="deleteSong('${s._id}')" class="text-xs text-pink-500 hover:text-pink-400 font-bold px-2 py-1">Delete</button>
          </div>
          ${s.recordingDate || s.studioLocation || s.engineers ? `
            <div class="text-[10px] text-zinc-500 border-t border-zinc-800/60 pt-1.5 flex gap-3">
              ${s.recordingDate ? `<span>Recorded: ${s.recordingDate}</span>` : ''}
              ${s.studioLocation ? `<span>Studio: ${s.studioLocation}</span>` : ''}
              ${s.engineers ? `<span>Engineers: ${s.engineers}</span>` : ''}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    async function addSong(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-song-btn');
      submitBtn.textContent = 'Saving to MongoDB...';
      submitBtn.disabled = true;

      try {
        let finalAudioUrl = document.getElementById('song-audio-url').value;
        let finalCoverArt = document.getElementById('song-cover-url').value;

        const audioFile = document.getElementById('song-audio-file').files[0];
        const coverFile = document.getElementById('song-cover-file').files[0];

        // Convert files to Base64 data strings for direct MongoDB insertion
        if (audioFile) {
          if (audioFile.size > 15 * 1024 * 1024) {
            alert('Audio file exceeds 15MB limit for direct MongoDB storage. Please select a smaller file or use a direct URL.');
            submitBtn.textContent = 'Save to MongoDB';
            submitBtn.disabled = false;
            return;
          }
          finalAudioUrl = await fileToBase64(audioFile);
        }

        if (coverFile) {
          finalCoverArt = await fileToBase64(coverFile);
        }

        if (!finalAudioUrl || !finalCoverArt) {
          alert('Please select files or enter direct URLs for both audio and cover art.');
          submitBtn.textContent = 'Save to MongoDB';
          submitBtn.disabled = false;
          return;
        }

        const body = {
          title: document.getElementById('song-title').value,
          artist: document.getElementById('song-artist').value,
          featuredArtists: document.getElementById('song-featured').value,
          era: document.getElementById('song-era').value,
          producers: document.getElementById('song-producers').value,
          engineers: document.getElementById('song-engineers').value,
          recordingDate: document.getElementById('song-rec-date').value,
          studioLocation: document.getElementById('song-location').value,
          coverArt: finalCoverArt,
          audioUrl: finalAudioUrl,
        };

        await fetch(`${API}/songs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        document.getElementById('song-form').reset();
        fetchSongs();
      } catch (err) {
        alert('Failed to save track to MongoDB.');
      } finally {
        submitBtn.textContent = 'Save to MongoDB';
        submitBtn.disabled = false;
      }
    }

    async function deleteSong(id) {
      await fetch(`${API}/songs/${id}`, { method: 'DELETE' });
      fetchSongs();
    }

    async function fetchNews() {
      const res = await fetch(`${API}/news`);
      const news = await res.json();
      document.getElementById('news-list').innerHTML = news.map(n => `
        <div class="flex items-center justify-between bg-[#121212] border border-[#1e1e1e] rounded-xl p-3">
          <div>
            <div class="font-bold text-xs text-purple-400">${n.version} - ${n.title}</div>
            <div class="text-[11px] text-zinc-400">${n.summary}</div>
          </div>
          <button onclick="deleteNews('${n._id}')" class="text-xs text-pink-500 hover:text-pink-400 font-bold px-2 py-1">Delete</button>
        </div>
      `).join('');
    }

    async function addNews(e) {
      e.preventDefault();
      const body = {
        version: document.getElementById('news-version').value,
        title: document.getElementById('news-title').value,
        group: document.getElementById('news-group').value,
        summary: document.getElementById('news-summary').value,
        changes: document.getElementById('news-changes').value.split(','),
        notifyUsers: document.getElementById('news-notify').checked
      };
      await fetch(`${API}/news`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      document.getElementById('news-form').reset();
      fetchNews();
    }

    async function deleteNews(id) {
      await fetch(`${API}/news/${id}`, { method: 'DELETE' });
      fetchNews();
    }

    if (localStorage.getItem('cw_auth_token')) {
      document.getElementById('login-modal').classList.add('hidden');
      loadAllData();
    }
  </script>
</body>
</html>
