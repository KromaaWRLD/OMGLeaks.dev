<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urbana High School - Student Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Mobile Toggle Button -->
  <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Navigation">
    <i class="fa-solid fa-bars" id="toggleIcon"></i>
  </button>

  <!-- Mobile Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Side Navigation -->
  <aside class="sidenav" id="sidenav">
    <div class="nav-header">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <div class="brand-title">Urbana High</div>
          <div class="brand-subtitle">Student Schedule Hub</div>
        </div>
      </div>

      <div class="user-card">
        <div class="user-name" id="userName">Loading Student...</div>
        <div class="user-school">Urbana High School</div>
      </div>
    </div>

    <!-- Navigation Menu Links -->
    <nav class="nav-menu">
      <a href="#dashboard" class="nav-item active" data-path="dashboard">
        <div class="nav-item-content">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </div>
      </a>

      <a href="#schedule" class="nav-item" data-path="schedule">
        <div class="nav-item-content">
          <i class="fa-solid fa-calendar-days"></i>
          <span>My Schedule</span>
        </div>
      </a>

      <a href="#sharing" class="nav-item" data-path="sharing">
        <div class="nav-item-content">
          <i class="fa-solid fa-user-group"></i>
          <span>Classmate Sharing</span>
        </div>
        <span class="badge" id="friendBadge" style="display: none;">0 new</span>
      </a>

      <a href="#study" class="nav-item" data-path="study">
        <div class="nav-item-content">
          <i class="fa-solid fa-book-open"></i>
          <span>Study Groups & Notes</span>
        </div>
      </a>

      <a href="#tasks" class="nav-item" data-path="tasks">
        <div class="nav-item-content">
          <i class="fa-solid fa-list-check"></i>
          <span>Tasks & Homework</span>
        </div>
        <span class="badge" id="taskBadge" style="display: none;">0</span>
      </a>

      <a href="#settings" class="nav-item" data-path="settings">
        <div class="nav-item-content">
          <i class="fa-solid fa-gear"></i>
          <span>Profile & Settings</span>
        </div>
      </a>
    </nav>

    <div class="nav-footer">
      <button id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Log Out</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Workspace -->
  <main class="main-content">
    <h1 id="pageTitle">Dashboard</h1>
    <p class="subtitle">Welcome to the Urbana High School schedule and class platform.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
