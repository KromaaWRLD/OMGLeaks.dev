<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Winters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth transition for sidebar width */
    #sidebar {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .nav-text, .brand-text {
      transition: opacity 0.2s ease, max-width 0.3s ease;
      white-space: nowrap;
    }

    /* Collapsed state adjustments */
    #sidebar.collapsed {
      width: 72px;
    }

    /* Hide text cleanly when collapsed */
    #sidebar.collapsed .brand-text,
    #sidebar.collapsed .nav-text,
    #sidebar.collapsed .support-badge {
      opacity: 0;
      max-width: 0;
      pointer-events: none;
      overflow: hidden;
      margin: 0;
    }

    /* Center standard navigation items when collapsed */
    #sidebar.collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
      width: 48px;
      height: 48px;
      margin: 0 auto;
    }

    /* Center Support Button when collapsed */
    #sidebar.collapsed .support-btn {
      justify-content: center;
      padding: 0;
      width: 48px;
      height: 48px;
      margin: 0 auto;
    }

    /* Hide header buttons when collapsed to clean up view */
    #sidebar.collapsed #bell-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* Center logo when collapsed */
    #sidebar.collapsed #brand-group {
      justify-content: center;
      width: 100%;
    }

    /* Custom Tooltip Styling */
    .tooltip {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-8px) translateY(-50%);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
    }

    /* Show Tooltip ONLY in Collapsed Mode on Hover */
    #sidebar.collapsed .has-tooltip:hover .tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(0) translateY(-50%);
    }

    /* Tooltip Arrow Pointer */
    .tooltip::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 8px;
      height: 8px;
      background-color: #18181b;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Nav Item Styling */
    .nav-item {
      color: #a7a7a7;
    }
    .nav-item:hover {
      background-color: #1f1f1f;
      color: #ffffff;
    }
    .nav-item.active {
      background-color: #282828;
      color: #ffffff;
    }
    
    /* Icon Colors - Pure White for Hover & Active */
    .default-icon {
      color: #a7a7a7;
      transition: color 0.15s ease;
    }
    .nav-item:hover .default-icon,
    .nav-item.active .default-icon {
      color: #ffffff !important;
    }

    /* Specialized Support Button Styling */
    .support-btn {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(159, 18, 57, 0.2) 100%);
      border: 1px solid rgba(236, 72, 153, 0.35);
      color: #f472b6;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .support-btn:hover {
      background: linear-gradient(135deg, rgba(236, 72, 153, 0.25) 0%, rgba(159, 18, 57, 0.35) 100%);
      border-color: rgba(236, 72, 153, 0.6);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(236, 72, 153, 0.25);
    }

    /* Drawer & Modal Transitions */
    #news-drawer, #article-modal-panel {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #news-backdrop, #article-modal-backdrop {
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body class="bg-[#09090b] text-white flex min-h-screen font-sans antialiased overflow-x-hidden">

  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="w-[250px] bg-[#121212] flex flex-col justify-between border-r border-[#1e1e1e] relative h-screen sticky top-0 shrink-0 overflow-visible z-20">
    
    <!-- TOP SECTION -->
    <div class="flex flex-col">
      
      <!-- HEADER / LOGO BAR -->
      <div class="flex items-center justify-between px-3 py-4 border-b border-[#1e1e1e] no-select relative min-h-[72px] w-full">
        
        <!-- Logo & Title Group (Clickable to Toggle Collapse) -->
        <div id="brand-group" class="has-tooltip flex items-center gap-3 cursor-pointer overflow-hidden shrink-0 relative flex-1">
          <!-- CW Purple Logo Box -->
          <div class="w-10 h-10 min-w-[40px] max-w-[40px] h-10 min-h-[40px] rounded-lg bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center font-extrabold italic text-white text-xs tracking-wider shadow-md shadow-purple-900/30 shrink-0">
            CW
          </div>
          
          <!-- Title Text -->
          <span class="brand-text font-bold text-sm tracking-wider text-white whitespace-nowrap">
            COLD WINTERS
          </span>

          <!-- Tooltip for Logo when Collapsed -->
          <div class="tooltip absolute left-[60px] top-1/2 bg-[#18181b] text-white text-xs font-semibold px-2.5 py-1.5 rounded-md border border-white/10 shadow-xl whitespace-nowrap z-50">
            Expand Sidebar
          </div>
        </div>

        <!-- Header Controls (Notification Bell) -->
        <div class="flex items-center shrink-0 ml-1">
          <button id="bell-btn" aria-label="What's New" class="relative w-8 h-8 min-w-[32px] rounded-lg flex items-center justify-center text-[#a7a7a7] hover:text-white hover:bg-[#282828] transition-all shrink-0">
            <!-- Modern Bell Icon -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>
            <!-- Unread Dot Badge -->
            <span id="unread-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-pink-500 rounded-full ring-2 ring-[#121212]"></span>
          </button>
        </div>

      </div>

      <!-- NAVIGATION LINKS -->
      <nav class="flex flex-col gap-1.5 p-2 no-select" id="nav-menu">
        
        <!-- Home Item -->
        <a href="#home" class="nav-item has-tooltip active flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group w-full cursor-pointer relative">
          <svg class="nav-icon default-icon w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span class="nav-text text-sm font-medium max-w-[140px] truncate">Home</span>
          <div class="tooltip absolute left-[56px] top-1/2 bg-[#18181b] text-white text-xs font-medium px-2.5 py-1.5 rounded-md border border-white/10 shadow-xl whitespace-nowrap z-50">
            Home
          </div>
        </a>

        <!-- Artists Item -->
        <a href="#artists" class="nav-item has-tooltip flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group w-full cursor-pointer relative">
          <svg class="nav-icon default-icon w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span class="nav-text text-sm font-medium max-w-[140px] truncate">Artists</span>
          <div class="tooltip absolute left-[56px] top-1/2 bg-[#18181b] text-white text-xs font-medium px-2.5 py-1.5 rounded-md border border-white/10 shadow-xl whitespace-nowrap z-50">
            Artists
          </div>
        </a>

        <!-- Specialized Support Us Button -->
        <a href="#support" class="support-btn has-tooltip flex items-center justify-between px-3 py-2.5 rounded-xl group w-full cursor-pointer relative mt-2">
          <div class="flex items-center gap-3">
            <svg class="w-5 h-5 shrink-0 fill-current text-pink-400 group-hover:text-white group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="nav-text text-sm font-semibold max-w-[110px] truncate">Support Us</span>
          </div>
          <span class="support-badge text-[10px] uppercase tracking-wider font-bold px-1.5 py-0.5 rounded bg-pink-500/20 text-pink-300 border border-pink-500/30">
            Sponsor
          </span>
          <div class="tooltip absolute left-[56px] top-1/2 bg-[#18181b] text-pink-300 text-xs font-semibold px-2.5 py-1.5 rounded-md border border-pink-500/30 shadow-xl whitespace-nowrap z-50">
            Support Us ❤️
          </div>
        </a>

      </nav>

    </div>

  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 p-8">
    <h1 class="text-2xl font-bold text-white mb-2">Welcome to Cold Winters</h1>
    <p class="text-zinc-400 text-sm">Click the CW logo to collapse or expand the sidebar. Click the bell icon to view live updates.</p>
  </main>

  <!-- CHANGELOG DRAWER -->
  <div id="news-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300"></div>

  <div id="news-drawer" class="fixed top-0 right-0 h-full w-[380px] max-w-[100vw] bg-[#121212] border-l border-[#1e1e1e] z-50 flex flex-col shadow-2xl translate-x-full">
    
    <div class="flex items-center justify-between p-4 border-b border-[#1e1e1e]">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
        </svg>
        <h2 class="font-bold text-base text-white tracking-wide">What's New</h2>
      </div>
      <button id="close-drawer-btn" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-[#282828] transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Drawer Content Area -->
    <div id="news-content" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm">
      <div class="animate-pulse space-y-3">
        <div class="h-4 bg-zinc-800 rounded w-1/3"></div>
        <div class="h-12 bg-zinc-900 rounded-lg"></div>
      </div>
    </div>

  </div>

  <!-- FULL ARTICLE MODAL -->
  <div id="article-modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
    <div id="article-modal-panel" class="bg-[#18181b] border border-[#27272a] rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl scale-95 transition-transform duration-300 overflow-hidden">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between p-5 border-b border-[#27272a] bg-[#121212]">
        <div class="flex items-center gap-2.5">
          <span id="modal-version" class="text-xs font-bold text-purple-400 px-2 py-0.5 rounded bg-purple-500/10 border border-purple-500/20"></span>
          <span id="modal-date" class="text-xs text-zinc-400"></span>
        </div>
        <button id="close-modal-btn" class="w-8 h-8 rounded-lg flex items-center justify-center text-zinc-400 hover:text-white hover:bg-[#282828] transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto flex-1 space-y-4">
        <h2 id="modal-title" class="text-xl font-bold text-white leading-snug"></h2>
        <div id="modal-author" class="text-xs text-zinc-500 font-medium pb-2 border-b border-zinc-800"></div>
        <p id="modal-summary" class="text-zinc-300 text-sm leading-relaxed italic bg-zinc-900/60 p-3 rounded-lg border border-zinc-800/80"></p>
        <div>
          <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Key Changes</h4>
          <ul id="modal-changes" class="list-disc list-inside space-y-1.5 text-zinc-300 text-xs leading-relaxed"></ul>
        </div>
        <div id="modal-full-text" class="text-zinc-300 text-xs leading-relaxed space-y-2 pt-2 border-t border-zinc-800/80"></div>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const brandGroup = document.getElementById('brand-group');
    const navItems = document.querySelectorAll('.nav-item');

    // Toggle Collapse
    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }
    brandGroup.addEventListener('click', toggleSidebar);

    // Tab Selection
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        navItems.forEach(nav => nav.classList.remove('active'));
        e.currentTarget.classList.add('active');
      });
    });

    // Elements
    const bellBtn = document.getElementById('bell-btn');
    const unreadDot = document.getElementById('unread-dot');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const newsDrawer = document.getElementById('news-drawer');
    const newsBackdrop = document.getElementById('news-backdrop');
    const newsContent = document.getElementById('news-content');

    const articleModalBackdrop = document.getElementById('article-modal-backdrop');
    const articleModalPanel = document.getElementById('article-modal-panel');
    const closeModalBtn = document.getElementById('close-modal-btn');

    let newsDataCache = [];

    // Open/Close Drawer
    function openDrawer() {
      newsDrawer.classList.remove('translate-x-full');
      newsBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      markNewsAsRead();
    }

    function closeDrawer() {
      newsDrawer.classList.add('translate-x-full');
      newsBackdrop.classList.add('opacity-0', 'pointer-events-none');
    }

    bellBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    newsBackdrop.addEventListener('click', closeDrawer);

    // Read Tracking in LocalStorage
    function markNewsAsRead() {
      if (newsDataCache.length > 0) {
        const latestId = newsDataCache[0].id || newsDataCache[0].version;
        localStorage.setItem('cw_last_read_news', latestId);
        unreadDot.classList.add('hidden');
      }
    }

    function checkUnreadStatus(latestId) {
      const lastRead = localStorage.getItem('cw_last_read_news');
      if (lastRead !== latestId) {
        unreadDot.classList.remove('hidden');
      } else {
        unreadDot.classList.add('hidden');
      }
    }

    // Live Polling news.json
    async function fetchNews() {
      try {
        const res = await fetch(`news.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('news.json not found');
        const data = await res.json();
        
        newsDataCache = data;
        if (data.length > 0) {
          const latestId = data[0].id || data[0].version;
          checkUnreadStatus(latestId);
          renderNewsCards(data);
        }
      } catch (err) {
        newsContent.innerHTML = `
          <div class="bg-[#18181b] border border-[#27272a] rounded-xl p-4 text-xs space-y-2">
            <span class="text-pink-400 font-bold">NOTE</span>
            <p class="text-zinc-300">Create a <code class="bg-black/50 px-1 py-0.5 rounded text-pink-300">news.json</code> file in your root folder to load updates dynamically.</p>
          </div>
        `;
      }
    }

    // Render Cards in Drawer
    function renderNewsCards(items) {
      newsContent.innerHTML = items.map((item, index) => `
        <div onclick="openArticleModal(${index})" class="bg-[#18181b] hover:bg-[#202024] border border-[#27272a] hover:border-purple-500/40 rounded-xl p-3.5 transition-all cursor-pointer group flex flex-col gap-1.5 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-purple-400 tracking-wider">${item.version}</span>
            <span class="text-[11px] text-zinc-500 font-medium">${item.date}</span>
          </div>
          <h3 class="font-semibold text-white text-sm group-hover:text-purple-300 transition-colors">${item.title}</h3>
          <p class="text-zinc-400 text-xs line-clamp-2">${item.summary || item.changes[0]}</p>
          <div class="text-[11px] font-semibold text-purple-400 flex items-center gap-1 mt-1">
            Read Full Release <span class="group-hover:translate-x-1 transition-transform">→</span>
          </div>
        </div>
      `).join('');
    }

    // Modal Functions
    window.openArticleModal = function(index) {
      const item = newsDataCache[index];
      if (!item) return;

      document.getElementById('modal-version').textContent = item.version;
      document.getElementById('modal-date').textContent = item.date;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-author').textContent = `Posted by ${item.author || 'Cold Winters Team'}`;
      document.getElementById('modal-summary').textContent = item.summary || 'Release updates and patch notes.';

      const changesList = document.getElementById('modal-changes');
      changesList.innerHTML = (item.changes || []).map(c => `<li>${c}</li>`).join('');

      document.getElementById('modal-full-text').textContent = item.fullArticle || 'No further details available for this release.';

      articleModalBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      articleModalPanel.classList.remove('scale-95');
    };

    function closeArticleModal() {
      articleModalBackdrop.classList.add('opacity-0', 'pointer-events-none');
      articleModalPanel.classList.add('scale-95');
    }

    closeModalBtn.addEventListener('click', closeArticleModal);
    articleModalBackdrop.addEventListener('click', (e) => {
      if (e.target === articleModalBackdrop) closeArticleModal();
    });

    // Initial load & poll every 5 seconds
    fetchNews();
    setInterval(fetchNews, 5000);
  </script>
</body>
</html>
