<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Winters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth transition for sidebar width */
    #sidebar {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .nav-text, .brand-text {
      transition: opacity 0.2s ease, max-width 0.3s ease;
      white-space: nowrap;
    }

    /* Collapsed state adjustments */
    #sidebar.collapsed {
      width: 80px;
    }

    /* Hide text cleanly when collapsed */
    #sidebar.collapsed .brand-text,
    #sidebar.collapsed .nav-text {
      opacity: 0;
      max-width: 0;
      pointer-events: none;
      overflow: hidden;
      margin: 0;
    }

    /* Center navigation items when collapsed */
    #sidebar.collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    /* Hide the chevron completely when collapsed to prevent overlap */
    #sidebar.collapsed #toggle-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* Prevent text highlight */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    /* CSS-based Active and Hover States */
    .nav-item {
      color: #b3b3b3;
    }
    .nav-item:hover {
      background-color: #1a1a1a;
      color: #ffffff;
    }
    .nav-item.active {
      background-color: #282828;
      color: #ffffff;
    }
    
    /* Default icon colors and active state */
    .nav-icon {
      color: currentColor;
    }
    .nav-item.active .default-icon {
      color: #34d399; /* Tailwind emerald-400 */
    }

    /* Force Support Us icon to stay pink regardless of hover/active */
    .pink-icon {
      color: #ec4899 !important; /* Tailwind pink-500 */
    }
  </style>
</head>
<body class="bg-[#09090b] text-white flex min-h-screen font-sans antialiased">

  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="w-[260px] bg-[#121212] flex flex-col justify-between border-r border-[#1e1e1e] relative h-screen sticky top-0 shrink-0 overflow-visible">
    
    <!-- TOP SECTION -->
    <div class="flex flex-col">
      
      <!-- HEADER / LOGO BAR -->
      <div class="flex items-center justify-between p-4 border-b border-[#1e1e1e] no-select relative min-h-[76px] w-full">
        
        <!-- Logo & Title Group (Now fully clickable to toggle both ways) -->
        <div id="brand-group" class="flex items-center gap-3 cursor-pointer overflow-hidden shrink-0 w-full">
          <!-- CW Purple Logo Box -->
          <div class="w-11 h-11 min-w-[44px] max-w-[44px] min-h-[44px] rounded-xl bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center font-extrabold italic text-white text-sm tracking-wider shadow-lg shadow-purple-900/30 shrink-0">
            CW
          </div>
          
          <!-- Title Text -->
          <span class="brand-text font-bold text-base tracking-wider text-white max-w-[140px] truncate">
            COLD WINTERS
          </span>
        </div>

        <!-- Collapse Toggle Button -->
        <button id="toggle-btn" aria-label="Toggle Sidebar" class="absolute right-4 w-8 h-8 min-w-[32px] rounded-lg flex items-center justify-center text-[#b3b3b3] hover:text-white hover:bg-[#282828] transition-all shrink-0">
          <svg class="toggle-chevron w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

      </div>

      <!-- NAVIGATION LINKS -->
      <nav class="flex flex-col gap-2 p-3 no-select" id="nav-menu">
        
        <!-- Home Item -->
        <a href="#home" class="nav-item active flex items-center px-3 py-3 rounded-xl transition-all group w-full cursor-pointer">
          <div class="w-11 min-w-[44px] flex items-center justify-center shrink-0">
            <svg class="nav-icon default-icon w-6 h-6 shrink-0 transition-colors" fill="currentColor" viewBox="0 0 24 24">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
          </div>
          <span class="nav-text text-sm font-semibold max-w-[150px] truncate ml-1">Home</span>
        </a>

        <!-- Artists Item -->
        <a href="#artists" class="nav-item flex items-center px-3 py-3 rounded-xl transition-all group w-full cursor-pointer">
          <div class="w-11 min-w-[44px] flex items-center justify-center shrink-0">
            <svg class="nav-icon default-icon w-6 h-6 shrink-0 transition-colors" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
          <span class="nav-text text-sm font-semibold max-w-[150px] truncate ml-1">Artists</span>
        </a>

        <!-- Support Us Button (Pink Icon) -->
        <a href="#support" class="nav-item flex items-center px-3 py-3 rounded-xl transition-all group w-full cursor-pointer">
          <div class="w-11 min-w-[44px] flex items-center justify-center shrink-0">
            <svg class="nav-icon pink-icon w-6 h-6 shrink-0 fill-current" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
          <span class="nav-text text-sm font-semibold max-w-[150px] truncate ml-1">Support Us</span>
        </a>

      </nav>

    </div>

  </aside>

  <!-- JAVASCRIPT FOR TOGGLE & TAB HIGHLIGHTING -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');
    const brandGroup = document.getElementById('brand-group');
    const navItems = document.querySelectorAll('.nav-item');

    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }

    // Both the arrow button and the logo now toggle the sidebar in both directions
    toggleBtn.addEventListener('click', toggleSidebar);
    brandGroup.addEventListener('click', toggleSidebar);

    // Dynamic active state switching
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        navItems.forEach(nav => {
          nav.classList.remove('active');
        });
        e.currentTarget.classList.add('active');
      });
    });
  </script>
</body>
</html>
