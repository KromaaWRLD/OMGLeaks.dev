<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMGLEAKS Navigation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth transition for sidebar width */
    #sidebar {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .nav-text, .brand-text {
      transition: opacity 0.2s ease, max-width 0.3s ease;
      white-space: nowrap;
    }

    /* Collapsed state rules */
    #sidebar.collapsed {
      width: 80px;
    }

    #sidebar.collapsed .brand-text,
    #sidebar.collapsed .nav-text {
      opacity: 0;
      max-width: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* Chevron rotation */
    #sidebar.collapsed .toggle-chevron {
      transform: rotate(180deg);
    }

    /* Prevent text highlight on interactive elements */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-[#09090b] text-white flex min-h-screen font-sans antialiased">

  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="w-[260px] bg-[#121212] flex flex-col justify-between p-3 border-r border-[#1e1e1e] relative h-screen sticky top-0 shrink-0">
    
    <!-- TOP SECTION -->
    <div class="flex flex-col gap-6">
      
      <!-- HEADER / LOGO BAR -->
      <div class="flex items-center justify-between px-1 py-1 no-select">
        
        <!-- Logo & Title Group -->
        <div id="brand-group" class="flex items-center gap-3 cursor-pointer overflow-hidden">
          <!-- OMG Purple Logo Box -->
          <div class="w-10 h-10 min-w-[40px] rounded-xl bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center font-extrabold italic text-white text-xs tracking-wider shadow-lg shadow-purple-900/30 shrink-0">
            OMG
          </div>
          
          <!-- Title Text -->
          <span class="brand-text font-bold text-base tracking-wider text-white max-w-[140px] truncate">
            LEAKS
          </span>
        </div>

        <!-- Collapse Toggle Button (Isolated to prevent overlay) -->
        <button id="toggle-btn" aria-label="Toggle Sidebar" class="toggle-btn w-8 h-8 min-w-[32px] rounded-lg flex items-center justify-center text-[#b3b3b3] hover:text-white hover:bg-[#282828] transition-all shrink-0">
          <svg class="toggle-chevron w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

      </div>

      <!-- NAVIGATION LINKS -->
      <nav class="flex flex-col gap-1.5 no-select">
        
        <!-- Home Item -->
        <a href="#home" class="flex items-center gap-4 px-3.5 py-3 rounded-xl bg-[#282828] text-white font-medium transition-colors hover:bg-[#323232] group">
          <svg class="w-5 h-5 min-w-[20px] text-white shrink-0" fill="currentColor" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span class="nav-text text-sm font-semibold max-w-[150px] truncate">Home</span>
        </a>

        <!-- Artists Item -->
        <a href="#artists" class="flex items-center gap-4 px-3.5 py-3 rounded-xl text-[#b3b3b3] hover:text-white hover:bg-[#1a1a1a] transition-all group">
          <svg class="w-5 h-5 min-w-[20px] shrink-0" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span class="nav-text text-sm font-semibold max-w-[150px] truncate">Artists</span>
        </a>

        <!-- Support Us Button -->
        <a href="#support" class="flex items-center gap-4 px-3.5 py-3 rounded-xl text-[#b3b3b3] hover:text-pink-500 hover:bg-[#1a1a1a] transition-all group">
          <svg class="w-5 h-5 min-w-[20px] shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="nav-text text-sm font-semibold max-w-[150px] truncate">Support Us</span>
        </a>

      </nav>

    </div>

  </aside>

  <!-- JAVASCRIPT FOR TOGGLING -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');
    const brandGroup = document.getElementById('brand-group');

    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }

    toggleBtn.addEventListener('click', toggleSidebar);
    brandGroup.addEventListener('click', () => {
      if (sidebar.classList.contains('collapsed')) {
        toggleSidebar();
      }
    });
  </script>
</body>
</html>
