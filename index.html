<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Winters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #sidebar { transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    #sidebar.collapsed { width: 72px; }
    .header-container { display: flex; align-items: center; min-height: 72px; width: 100%; position: relative; }
    .nav-item { position: relative; display: flex; align-items: center; height: 48px; width: 100%; border-radius: 0.5rem; color: #a7a7a7; overflow: visible; transition: background-color 0.2s ease, border-color 0.2s ease; }
    .icon-wrapper { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 2; }
    #brand-group .icon-wrapper { left: 12px; width: 32px; height: 32px; }
    .fade-text-container { margin-left: 52px; white-space: nowrap; overflow: hidden; display: inline-block; -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to right, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); -webkit-mask-size: 200% 100%; mask-size: 200% 100%; -webkit-mask-position: 0% 0; mask-position: 0% 0; transition: -webkit-mask-position 0.25s cubic-bezier(0.4, 0, 0.2, 1), mask-position 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease; opacity: 1; }
    .brand-text-container { transition: -webkit-mask-position 0.12s cubic-bezier(0.4, 0, 1, 1), mask-position 0.12s cubic-bezier(0.4, 0, 1, 1), opacity 0.12s ease; }
    #sidebar.collapsed .fade-text-container, #sidebar.collapsed .brand-text-container { -webkit-mask-position: 100% 0; mask-position: 100% 0; opacity: 0; pointer-events: none; }
    #bell-btn { transition: opacity 0.15s ease, transform 0.25s ease; }
    #sidebar.collapsed #bell-btn { opacity: 0; transform: scale(0.8); pointer-events: none; }
    .support-item { border: 1px solid #27272a; }
    #sidebar.collapsed .support-item { border-color: transparent !important; }
    .separator { height: 1px; margin-top: 6px; margin-bottom: 6px; width: 100%; transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .no-select { user-select: none; -webkit-user-select: none; }
    .nav-item:hover { background-color: #1f1f1f; color: #ffffff; }
    .nav-item.active { background-color: #282828; color: #ffffff; }
    .default-icon { color: #a7a7a7; transition: color 0.15s ease; }
    .nav-item:hover .default-icon, .nav-item.active .default-icon { color: #ffffff !important; }
    .pink-icon { color: #ec4899; transition: color 0.15s ease; }
    .support-item:hover .pink-icon { color: #ffffff !important; }
    .tooltip { opacity: 0; visibility: hidden; top: -32px; left: 50%; transform: translateX(-50%) translateY(4px); transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease; pointer-events: none; }
    #sidebar.collapsed .has-tooltip:hover .tooltip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    .tooltip::before { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 8px; height: 8px; background-color: #18181b; border-right: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    #news-drawer, #article-modal-panel { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    #news-backdrop, #article-modal-backdrop { transition: opacity 0.3s ease; }
  </style>
</head>
<body class="bg-[#09090b] text-white flex min-h-screen font-sans antialiased overflow-x-hidden">

  <!-- UNTOUCHED SIDEBAR -->
  <aside id="sidebar" class="w-[250px] bg-[#121212] flex flex-col justify-between border-r border-[#1e1e1e] relative h-screen sticky top-0 shrink-0 overflow-visible z-20">
    <div class="flex flex-col">
      <div class="header-container border-b border-[#1e1e1e] no-select">
        <div id="brand-group" class="flex items-center cursor-pointer overflow-hidden relative shrink-0 w-full h-full">
          <div class="icon-wrapper">
            <div class="w-8 h-8 min-w-[32px] max-w-[32px] h-8 min-h-[32px] rounded-md bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center font-extrabold italic text-white text-[10px] tracking-wider shadow-md shadow-purple-900/30 shrink-0">CW</div>
          </div>
          <div class="fade-text-container brand-text-container">
            <span class="font-bold text-xs tracking-wider text-white">COLD WINTERS</span>
          </div>
        </div>
        <button id="bell-btn" aria-label="What's New" class="absolute right-3 w-8 h-8 rounded-lg flex items-center justify-center text-[#a7a7a7] hover:text-white hover:bg-[#282828] shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>
          <span id="unread-dot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-pink-500 rounded-full ring-2 ring-[#121212]"></span>
        </button>
      </div>

      <nav class="flex flex-col p-2 no-select" id="nav-menu" style="gap: 6px;">
        <a href="#home" class="nav-item has-tooltip active group cursor-pointer relative">
          <div class="icon-wrapper"><svg class="nav-icon default-icon w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
          <div class="fade-text-container"><span class="text-sm font-medium">Home</span></div>
          <div class="tooltip absolute bg-[#18181b] text-white text-xs font-medium px-2.5 py-1.5 rounded-md border border-white/10 shadow-xl whitespace-nowrap z-50">Home</div>
        </a>
        <a href="#artists" class="nav-item has-tooltip group cursor-pointer relative">
          <div class="icon-wrapper"><svg class="nav-icon default-icon w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
          <div class="fade-text-container"><span class="text-sm font-medium">Artists</span></div>
          <div class="tooltip absolute bg-[#18181b] text-white text-xs font-medium px-2.5 py-1.5 rounded-md border border-white/10 shadow-xl whitespace-nowrap z-50">Artists</div>
        </a>
        <div class="separator bg-[#1e1e1e]"></div>
        <a href="#support" class="nav-item support-item has-tooltip group cursor-pointer relative">
          <div class="icon-wrapper"><svg class="nav-icon pink-icon w-5 h-5 shrink-0 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
          <div class="fade-text-container"><span class="text-sm font-medium">Support Us</span></div>
          <div class="tooltip absolute bg-[#18181b] text-white text-xs font-medium px-2.5 py-1.5 rounded-md border border-white/10 shadow-xl whitespace-nowrap z-50">Support Us</div>
        </a>
      </nav>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA WITH JUICE WRLD ERAS -->
  <main class="flex-1 p-8 pb-28 space-y-8">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-extrabold tracking-wider text-white">Music Library</h1>
      <a href="editor.html" class="text-xs font-bold text-purple-400 bg-purple-500/10 border border-purple-500/20 px-3 py-1.5 rounded-lg hover:bg-purple-500/20">Editor Portal Portal →</a>
    </div>

    <!-- OUTSIDERS (OUT) ERA -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400 flex items-center gap-2">
        <span>Outsiders Era</span> <span class="text-[10px] bg-purple-500/20 px-2 py-0.5 rounded text-purple-300">OUT</span>
      </h2>
      <div id="era-OUT" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <!-- LEGENDS NEVER DIE (LND) ERA -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400 flex items-center gap-2">
        <span>Legends Never Die</span> <span class="text-[10px] bg-purple-500/20 px-2 py-0.5 rounded text-purple-300">LND</span>
      </h2>
      <div id="era-LND" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <!-- FIGHTING DEMONS (FD) ERA -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400 flex items-center gap-2">
        <span>Fighting Demons</span> <span class="text-[10px] bg-purple-500/20 px-2 py-0.5 rounded text-purple-300">FD</span>
      </h2>
      <div id="era-FD" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <!-- JW3 ERA -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold uppercase tracking-wider text-purple-400 flex items-center gap-2">
        <span>JW3 Era</span> <span class="text-[10px] bg-purple-500/20 px-2 py-0.5 rounded text-purple-300">JW3</span>
      </h2>
      <div id="era-JW3" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>
  </main>

  <!-- STICKY BOTTOM MUSIC PLAYER BAR -->
  <div id="music-player-bar" class="fixed bottom-0 left-0 right-0 h-20 bg-[#121212]/95 border-t border-[#1e1e1e] backdrop-blur-md z-30 flex items-center justify-between px-6 translate-y-full transition-transform duration-300">
    <!-- Current Playing Track Info -->
    <div class="flex items-center gap-3 w-1/4">
      <img id="player-cover" src="" class="w-12 h-12 rounded-lg object-cover bg-zinc-800">
      <div class="overflow-hidden">
        <div id="player-title" class="font-bold text-sm text-white truncate">Select a song</div>
        <div id="player-artist" class="text-xs text-zinc-400 truncate">-</div>
      </div>
    </div>

    <!-- Central Audio Controls -->
    <div class="flex flex-col items-center gap-1 w-1/2 max-w-md">
      <div class="flex items-center gap-4">
        <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-bold shadow-lg hover:scale-105 transition-transform">
          ▶
        </button>
      </div>
      <audio id="audio-element" class="hidden"></audio>
    </div>

    <div class="w-1/4 flex justify-end"></div>
  </div>

  <!-- CHANGELOG DRAWER & MODAL HTML... (Drawer JS Polls DB API) -->
  <script>
    const API_URL = "/api";
    const sidebar = document.getElementById('sidebar');
    const brandGroup = document.getElementById('brand-group');

    function toggleSidebar() { sidebar.classList.toggle('collapsed'); }
    brandGroup.addEventListener('click', toggleSidebar);

    // Load Songs Categorized by Era
    async function loadSongs() {
      try {
        const res = await fetch(`${API}/songs`);
        const songs = await res.json();
        
        ['OUT', 'LND', 'FD', 'JW3'].forEach(era => {
          const eraContainer = document.getElementById(`era-${era}`);
          const eraSongs = songs.filter(s => s.era === era);
          
          if (eraSongs.length === 0) {
            eraContainer.innerHTML = `<div class="text-xs text-zinc-600 col-span-full">No songs added for this era yet.</div>`;
          } else {
            eraContainer.innerHTML = eraSongs.map(s => `
              <div onclick='playSong(${JSON.stringify(s)})' class="bg-[#121212] hover:bg-[#18181b] border border-[#1e1e1e] hover:border-purple-500/40 rounded-xl p-3 transition-all cursor-pointer group space-y-2">
                <img src="${s.coverArt}" class="w-full aspect-square rounded-lg object-cover">
                <div>
                  <h3 class="font-bold text-sm text-white group-hover:text-purple-300 truncate">${s.title}</h3>
                  <p class="text-xs text-zinc-400 truncate">${s.artist}</p>
                </div>
              </div>
            `).join('');
          }
        });
      } catch (err) {
        console.error("Could not load songs from API", err);
      }
    }

    // Audio Player Logic
    const playerBar = document.getElementById('music-player-bar');
    const audioElement = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');

    function playSong(song) {
      document.getElementById('player-cover').src = song.coverArt;
      document.getElementById('player-title').textContent = song.title;
      document.getElementById('player-artist').textContent = song.artist;
      
      audioElement.src = song.audioUrl;
      audioElement.play();
      
      playBtn.textContent = '⏸';
      playerBar.classList.remove('translate-y-full');
    }

    function togglePlay() {
      if (audioElement.paused) {
        audioElement.play();
        playBtn.textContent = '⏸';
      } else {
        audioElement.pause();
        playBtn.textContent = '▶';
      }
    }

    // Fetch News from MongoDB
    async function fetchNews() {
      try {
        const res = await fetch(`${API}/news`);
        const data = await res.json();
        // Uses your active grouped cards rendering logic for news drawer...
      } catch (e) {}
    }

    loadSongs();
    setInterval(loadSongs, 5000);
  </script>
</body>
</html>
