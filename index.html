<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMGleaks Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        
        /* Master Sidebar Transition */
        #sidebar {
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: 250px;
        }
        
        /* Exact Collapsed Width */
        #sidebar.collapsed {
            width: 104px;
        }

        /* 
         * The wrapper for text elements.
         * We transition max-width, opacity, and margin together 
         * so it shrinks fluidly and completely disappears without layout jumping.
         */
        .collapsible-wrapper {
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            opacity: 1;
            max-width: 150px; 
            margin-left: 0.75rem; /* 12px gap between icon/logo and text */
            transition: max-width 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        margin-left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #sidebar.collapsed .collapsible-wrapper {
            max-width: 0;
            opacity: 0;
            margin-left: 0;
            pointer-events: none;
        }

        /* Chevron Rotation */
        #toggle-icon {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        #sidebar.collapsed #toggle-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="text-gray-300 antialiased h-screen w-full flex overflow-hidden">

    <!-- Sidebar Container -->
    <aside id="sidebar" class="h-full bg-[#121212] flex flex-col flex-shrink-0 border-r border-[#282828]/50">
        
        <!-- Header -->
        <!-- px-4 (16px left + 16px right) + 40px Logo + 32px Chevron = exactly 104px when text collapses -->
        <div class="flex items-center justify-between px-4 h-[84px]">
            <div class="flex items-center">
                <!-- Unselectable Logo Graphic (40x40) -->
                <div class="w-10 h-10 flex-shrink-0 rounded-lg bg-gradient-to-br from-[#7c3aed] to-[#3b0764] flex items-center justify-center select-none shadow-md">
                    <span class="text-white text-[14px] font-black italic tracking-widest leading-none mt-[2px] pr-[2px]">OMG</span>
                </div>
                
                <!-- Title (Collapsible) -->
                <div class="collapsible-wrapper">
                    <span class="text-white font-bold tracking-widest text-[16px] mt-[2px]">LEAKS</span>
                </div>
            </div>
            
            <!-- Toggle Button (32x32) -->
            <button id="toggle-btn" class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-md text-[#a7a7a7] hover:text-white hover:bg-[#282828] transition-colors duration-200 focus:outline-none">
                <svg id="toggle-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
        </div>

        <!-- Navigation Items -->
        <!-- px-2 on nav + p-2 on link = 16px left offset, perfectly aligning the 40x40 icons with the 40x40 logo -->
        <nav class="flex flex-col px-2 space-y-1 mt-2">
            
            <!-- Home (Active State) -->
            <a href="#" class="flex items-center p-2 rounded-md bg-[#282828] text-white transition-colors duration-200">
                <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                    <!-- Solid House Icon -->
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
                        <path d="M12 5.432l8.159 8.159c.03.03.058.062.083.095.39.518.334 1.258-.126 1.718L19.5 16.023V21a1 1 0 01-1 1h-3a1 1 0 01-1-1v-4a1 1 0 00-1-1h-2a1 1 0 00-1 1v4a1 1 0 01-1 1H5.5a1 1 0 01-1-1v-4.977l-.616-.619c-.46-.46-.515-1.2-.126-1.718a.752.752 0 01.083-.095L12 5.432z" />
                    </svg>
                </div>
                <div class="collapsible-wrapper font-semibold text-[15px]">
                    Home
                </div>
            </a>

            <!-- Artists (Inactive State) -->
            <a href="#" class="flex items-center p-2 rounded-md text-[#b3b3b3] hover:bg-[#282828] hover:text-white transition-colors duration-200 group">
                <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                    <!-- Solid Person Icon -->
                    <svg class="w-6 h-6 group-hover:text-white transition-colors duration-200" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="collapsible-wrapper font-medium text-[15px]">
                    Artists
                </div>
            </a>

            <!-- Discord (Inactive State with Blurple Hover) -->
            <a href="#" class="flex items-center p-2 rounded-md text-[#b3b3b3] hover:bg-[#282828] transition-colors duration-200 group">
                <div class="w-10 h-10 flex-shrink-0 flex items-center justify-center">
                    <!-- Discord Logo -->
                    <svg class="w-6 h-6 text-[#b3b3b3] group-hover:text-[#5865F2] transition-colors duration-200" viewBox="0 0 127.14 96.36" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c0,0,0-.01,0-.02C129.67,52.26,122.56,28.18,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                    </svg>
                </div>
                <div class="collapsible-wrapper font-medium text-[15px] group-hover:text-white transition-colors duration-200">
                    Discord
                </div>
            </a>

        </nav>
    </aside>

    <script>
        const toggleBtn = document.getElementById('toggle-btn');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
