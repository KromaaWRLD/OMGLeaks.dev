<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Winters</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth transition for sidebar width */
    #sidebar {
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .nav-text, .brand-text {
      transition: opacity 0.2s ease, max-width 0.3s ease;
      white-space: nowrap;
    }

    /* Collapsed state adjustments */
    #sidebar.collapsed {
      width: 72px; /* Sleeker, standard collapsed width */
    }

    /* Hide text cleanly when collapsed */
    #sidebar.collapsed .brand-text,
    #sidebar.collapsed .nav-text {
      opacity: 0;
      max-width: 0;
      pointer-events: none;
      overflow: hidden;
      margin: 0;
    }

    /* Center navigation items when collapsed */
    #sidebar.collapsed .nav-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
      width: 48px;
      height: 48px;
      margin: 0 auto;
    }

    /* Hide the chevron completely when collapsed */
    #sidebar.collapsed #toggle-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* Center logo when collapsed */
    #sidebar.collapsed #brand-group {
      justify-content: center;
      width: 100%;
    }

    /* Prevent text highlight */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Base Nav Styling */
    .nav-item {
      color: #a7a7a7;
    }
    .nav-item:hover {
      background-color: #1f1f1f;
      color: #ffffff;
    }
    .nav-item.active {
      background-color: #2a2a2a;
      color: #ffffff;
    }
    
    /* Icon Colors */
    .default-icon {
      color: #a7a7a7;
    }
    .nav-item:hover .default-icon {
      color: #ffffff;
    }
    .nav-item.active .default-icon {
      color: #10b981; /* Emerald Green */
    }

    /* Support Us Pink Icon */
    .pink-icon {
      color: #ec4899 !important; /* Pink-500 */
    }
  </style>
</head>
<body class="bg-[#09090b] text-white flex min-h-screen font-sans antialiased">

  <!-- SIDEBAR NAVIGATION -->
  <aside id="sidebar" class="w-[240px] bg-[#121212] flex flex-col justify-between border-r border-[#1e1e1e] relative h-screen sticky top-0 shrink-0 overflow-visible">
    
    <!-- TOP SECTION -->
    <div class="flex flex-col">
      
      <!-- HEADER / LOGO BAR -->
      <div class="flex items-center justify-between px-3 py-4 border-b border-[#1e1e1e] no-select relative min-h-[72px] w-full">
        
        <!-- Logo & Title Group (Clickable) -->
        <div id="brand-group" class="flex items-center gap-3 cursor-pointer overflow-hidden shrink-0">
          <!-- CW Purple Logo Box -->
          <div class="w-10 h-10 min-w-[40px] max-w-[40px] h-10 min-h-[40px] rounded-lg bg-gradient-to-br from-purple-600 to-indigo-800 flex items-center justify-center font-extrabold italic text-white text-xs tracking-wider shadow-md shadow-purple-900/30 shrink-0">
            CW
          </div>
          
          <!-- Title Text -->
          <span class="brand-text font-bold text-sm tracking-wider text-white max-w-[130px] truncate">
            COLD WINTERS
          </span>
        </div>

        <!-- Collapse Toggle Button -->
        <button id="toggle-btn" aria-label="Toggle Sidebar" class="absolute right-3 w-7 h-7 min-w-[28px] rounded-lg flex items-center justify-center text-[#a7a7a7] hover:text-white hover:bg-[#282828] transition-all shrink-0">
          <svg class="toggle-chevron w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

      </div>

      <!-- NAVIGATION LINKS -->
      <nav class="flex flex-col gap-1.5 p-2 no-select" id="nav-menu">
        
        <!-- Home Item -->
        <a href="#home" class="nav-item active flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group w-full cursor-pointer">
          <svg class="nav-icon default-icon w-5 h-5 shrink-0 transition-colors" fill="currentColor" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span class="nav-text text-sm font-medium max-w-[140px] truncate">Home</span>
        </a>

        <!-- Artists Item -->
        <a href="#artists" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group w-full cursor-pointer">
          <svg class="nav-icon default-icon w-5 h-5 shrink-0 transition-colors" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span class="nav-text text-sm font-medium max-w-[140px] truncate">Artists</span>
        </a>

        <!-- Support Us Button -->
        <a href="#support" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group w-full cursor-pointer">
          <svg class="nav-icon pink-icon w-5 h-5 shrink-0 fill-current" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="nav-text text-sm font-medium max-w-[140px] truncate">Support Us</span>
        </a>

      </nav>

    </div>

  </aside>

  <!-- JAVASCRIPT -->
  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');
    const brandGroup = document.getElementById('brand-group');
    const navItems = document.querySelectorAll('.nav-item');

    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
    }

    toggleBtn.addEventListener('click', toggleSidebar);
    brandGroup.addEventListener('click', toggleSidebar);

    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        navItems.forEach(nav => nav.classList.remove('active'));
        e.currentTarget.classList.add('active');
      });
    });
  </script>
</body>
</html>
